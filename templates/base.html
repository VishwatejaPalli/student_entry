<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Configurable Room Entry & Data Management System">
    <title>{% block title %}Room Entry System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    <script>
        // Global Theme Management (Instant Anti-FOUC & available before DOM renders)
        window.setAppTheme = function(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (document.body) {
                document.body.setAttribute('data-theme', theme);
            }
            try {
                localStorage.setItem('theme', theme);
            } catch (e) {}

            const lightBtn = document.getElementById('themeSegLight');
            const darkBtn = document.getElementById('themeSegDark');
            if (lightBtn && darkBtn) {
                if (theme === 'light') {
                    lightBtn.classList.add('active');
                    darkBtn.classList.remove('active');
                } else {
                    darkBtn.classList.add('active');
                    lightBtn.classList.remove('active');
                }
            }
        };

        window.initTheme = function() {
            let saved = 'dark';
            try {
                saved = localStorage.getItem('theme') || 'dark';
            } catch (e) {}
            window.setAppTheme(saved);
        };

        // Initialize immediately
        window.initTheme();
        document.addEventListener('DOMContentLoaded', window.initTheme);
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-wrapper">
        {% include "components/navbar.html" %}

        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Shared JS -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

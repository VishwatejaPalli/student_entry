{% extends "base.html" %}

{% block title %}Preview — {{ form.name }} — Room Entry System{% endblock %}

{% block content %}
<div class="container container--narrow">
    <div class="admin-header">
        <div>
            <h1><span class="material-symbols-outlined" style="font-size: 1.8rem; vertical-align: middle; margin-right: 6px;">visibility</span>Form Preview</h1>
        </div>
        <div class="admin-actions">
            <a href="/admin/forms/builder/{{ form.id }}" class="btn btn-secondary btn-sm">← Edit</a>
        </div>
    </div>

    <div class="card entry-card" style="max-width: 100%;">
        <div class="card-header" style="flex-direction: column; align-items: center; text-align: center; border-bottom: none;">
            <div class="entry-icon" style="display: inline-flex; align-items: center; justify-content: center;"><span class="material-symbols-outlined" style="font-size: 2rem;">badge</span></div>
            <h2>{{ form.name }}</h2>
            <p class="entry-subtitle">Preview Mode — No data is submitted</p>
        </div>

        <div class="form-group">
            <label>Roll Number</label>
            <input type="text" class="form-input form-input--large" value="24885A0407" disabled>
        </div>

        {{ form_html | safe }}

        <div class="mt-lg">
            <button class="btn btn-success btn-lg btn-block" disabled style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                <span class="material-symbols-outlined">how_to_reg</span>
                <span>Record Entry (Preview)</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}
